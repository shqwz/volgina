<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#EDEFE9; }
  * { box-sizing:border-box; }
  a { color:inherit; text-decoration:none; }
</style>
</helmet>
<div style="padding:clamp(40px,6vw,80px) clamp(20px,5vw,56px);color:#2F3A33;text-align:center">
  <div style="max-width:1120px;margin:0 auto">
    <div style="font-family:Jost,Helvetica,sans-serif;font-weight:300;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#B08D57;margin-bottom:clamp(28px,3.6vw,44px)">Галерея</div>
    <div style="position:relative;overflow:hidden;background:#E3E6DE">
      <img src="{{ current }}" alt="Праздник" style="display:block;width:100%;aspect-ratio:3/2;object-fit:cover">
      <button onClick="{{ prev }}" style="position:absolute;left:0;top:0;height:100%;width:clamp(52px,8vw,92px);border:0;background:transparent;cursor:pointer;font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;color:#EDEFE9;text-shadow:0 1px 12px rgba(0,0,0,.4)">‹</button>
      <button onClick="{{ next }}" style="position:absolute;right:0;top:0;height:100%;width:clamp(52px,8vw,92px);border:0;background:transparent;cursor:pointer;font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;color:#EDEFE9;text-shadow:0 1px 12px rgba(0,0,0,.4)">›</button>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin-top:6px">
      <sc-for list="{{ shots }}" as="shot" hint-placeholder-count="12">
        <button onClick="{{ shot.pick }}" style="flex:0 0 auto;width:clamp(58px,7vw,84px);border:0;padding:0;background:none;cursor:pointer;opacity:{{ shot.dim }}">
          <img src="{{ shot.src }}" alt="Праздник" loading="lazy" style="display:block;width:100%;aspect-ratio:1/1;object-fit:cover">
        </button>
      </sc-for>
    </div>
    <div style="margin-top:clamp(14px,2vw,20px);font-family:Jost,Helvetica,sans-serif;font-weight:300;font-size:11px;letter-spacing:.3em;color:#5D6B60">{{ counter }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0 };
  renderVals() {
    const files = Array.from({length:12}, (_, k) => './images/g' + (k+1) + '.jpg');
    const i = this.state.i;
    return {
      current: files[i],
      counter: String(i+1).padStart(2,'0') + ' / ' + files.length,
      prev: () => this.setState(s => ({ i: (s.i - 1 + files.length) % files.length })),
      next: () => this.setState(s => ({ i: (s.i + 1) % files.length })),
      shots: files.map((src, k) => ({ src, dim: k === i ? 1 : 0.45, pick: () => this.setState({ i: k }) }))
    };
  }
}
</script>
</body>
</html>
