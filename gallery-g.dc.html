<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let raf = null;
    const apply = () => {
      raf = null;
      const vh = window.innerHeight;
      const hint = document.querySelector('[data-hint]');
      Array.from(document.querySelectorAll('[data-tile]')).forEach(t => {
        const r = t.getBoundingClientRect();
        const center = r.top + r.height / 2;
        const span = (vh + r.height) / 2;
        const d = Math.min(1, Math.abs(center - vh / 2) / span);
        const p = 1 - d;
        const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        t.style.transform = 'scale(' + eased.toFixed(4) + ')';
      });
      if (hint) hint.style.opacity = String(Math.max(0, 1 - window.scrollY / (vh * 0.4)));
    };
    this._on = () => { if (!raf) raf = requestAnimationFrame(apply); };
    window.addEventListener('scroll', this._on, { passive: true });
    window.addEventListener('resize', this._on);
    document.addEventListener('scroll', this._on, { passive: true, capture: true });
    apply();
    requestAnimationFrame(apply);
    setTimeout(apply, 300);
    setTimeout(apply, 1200);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._on);
    window.removeEventListener('resize', this._on);
    document.removeEventListener('scroll', this._on, true);
  }
}
</script>
